# EKS auto-creates a default "gp2" StorageClass at cluster bootstrap that
# points at the in-tree `kubernetes.io/aws-ebs` provisioner — which no
# longer exists in Kubernetes itself (removed in the CSI migration). That
# stale class can still be marked default, so PVCs are pinned to this one
# explicitly (see storageClassName in postgres.yaml/redis.yaml) rather
# than relying on whichever class the cluster resolves as default.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
