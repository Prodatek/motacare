# ============================================================
# NGINX INGRESS CONTROLLER
#
# Single public domain — motacare.buildspecs.io. The browser only
# ever talks to the `web` (Next.js) service; it proxies /api/*
# server-side to the internal api-gateway (see
# apps/web/next.config.js and configmaps/configmap.yaml's
# NEXT_PUBLIC_API_URL comment). api-gateway and every backend
# service stay ClusterIP-only — NOT reachable from outside the
# cluster — except subscription-service, which needs one public
# path for Stripe webhooks (those bypass the gateway and need a
# real internet-facing URL).
#
# Prerequisites (installed automatically by Terraform's helm
# provider — see infra/terraform/addons.tf):
#   - ingress-nginx controller
#   - cert-manager
#
# DNS: motacare.buildspecs.io is managed outside this AWS account.
# After `terraform apply`, get the load balancer hostname with:
#   kubectl get ingress motacare-ingress -n motacare
# and create a CNAME record pointing motacare.buildspecs.io at it.
# Note: that hostname changes every time the cluster is destroyed
# and recreated — the CNAME needs updating each time.
# ============================================================

# ── cert-manager ClusterIssuer for Let's Encrypt TLS ──
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # REPLACE with a real email — used for cert expiry warnings
    email: devops@motacare.buildspecs.io
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx

---
# ── Single Ingress — motacare.buildspecs.io ──
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: motacare-ingress
  namespace: motacare
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod

    # Rate limiting — prevent abuse (200 req/min per IP)
    nginx.ingress.kubernetes.io/limit-rps: "200"
    nginx.ingress.kubernetes.io/limit-connections: "20"

    # Proxy timeouts (long-running inspection/PDF operations)
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

    # Body size — allow inspection photo uploads up to 20MB
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"

    # WebSocket upgrades are proxied natively by ingress-nginx once this
    # is set — no configuration-snippet needed. (Security headers are
    # already set at the app layer in apps/web/next.config.js; recent
    # ingress-nginx versions block configuration-snippet by default
    # since it allows arbitrary nginx config injection, so don't
    # reintroduce it here just to duplicate headers Next.js already sends.)
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"

    # Redirect www → apex (harmless if no www CNAME exists)
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"

spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - motacare.buildspecs.io
      secretName: motacare-tls
  rules:
    - host: motacare.buildspecs.io
      http:
        paths:
          # Stripe webhooks go directly to subscription-service —
          # they need the raw body, not the api-gateway/Next.js
          # JSON parsers.
          - path: /webhooks/stripe
            pathType: Exact
            backend:
              service:
                name: subscription-service
                port:
                  number: 3007

          # Everything else → web (Next.js), which proxies /api/*
          # to api-gateway internally.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3005

---
# ── HTTP → HTTPS redirect ──
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: motacare-https-redirect
  namespace: motacare
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: motacare.buildspecs.io
