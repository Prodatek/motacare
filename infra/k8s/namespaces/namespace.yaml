apiVersion: v1
kind: Namespace
metadata:
  name: motacare
  labels:
    app.kubernetes.io/name: motacare
    environment: production

---
# Resource quotas prevent a single runaway pod from taking the node down
apiVersion: v1
kind: ResourceQuota
metadata:
  name: motacare-quota
  namespace: motacare
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "40"
    services: "20"
    persistentvolumeclaims: "10"