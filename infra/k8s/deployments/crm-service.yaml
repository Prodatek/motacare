apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-service
  namespace: motacare
  labels:
    app: crm-service
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crm-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: crm-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: crm-service
          image: REPLACE_WITH_ECR_URI/motacare-crm-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3010
          envFrom:
            - configMapRef:
                name: motacare-config
            - secretRef:
                name: motacare-secrets
          env:
            - name: PORT
              value: "3010"
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: motacare-config
                  key: CRM_DB_NAME
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3010
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3010
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: crm-service
  namespace: motacare
spec:
  selector:
    app: crm-service
  ports:
    - port: 3010
      targetPort: 3010
