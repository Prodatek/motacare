apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoicing-service
  namespace: motacare
  labels:
    app: invoicing-service
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: invoicing-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0    # zero-downtime — always keep existing pods up during rollout
  template:
    metadata:
      labels:
        app: invoicing-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: invoicing-service
          image: ghcr.io/Prodatek/motacare/invoicing-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3011
          envFrom:
            - configMapRef:
                name: motacare-config
            - secretRef:
                name: motacare-secrets
          env:
            - name: PORT
              value: "3011"
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: motacare-config
                  key: INVOICING_DB_NAME
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3011
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3011
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: invoicing-service
  namespace: motacare
spec:
  selector:
    app: invoicing-service
  ports:
    - port: 3011
      targetPort: 3011
