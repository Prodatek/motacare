apiVersion: apps/v1
kind: Deployment
metadata:
  name: fix-jobs
  namespace: motacare
  labels:
    app: fix-jobs
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fix-jobs
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: fix-jobs
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: fix-jobs
          image: REPLACE_WITH_ECR_URI/motacare-fix-jobs:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3004
          envFrom:
            - configMapRef:
                name: motacare-config
            - secretRef:
                name: motacare-secrets
          env:
            - name: PORT
              value: "3004"
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: motacare-config
                  key: FIX_JOBS_DB_NAME
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: fix-jobs
  namespace: motacare
spec:
  selector:
    app: fix-jobs
  ports:
    - port: 3004
      targetPort: 3004
