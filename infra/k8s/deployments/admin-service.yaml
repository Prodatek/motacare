apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: motacare
  labels:
    app: admin-service
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: admin-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: admin-service
          image: REPLACE_WITH_ECR_URI/motacare-admin-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3009
          envFrom:
            - configMapRef:
                name: motacare-config
            - secretRef:
                name: motacare-secrets
          env:
            - name: PORT
              value: "3009"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3009
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3009
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: motacare
spec:
  selector:
    app: admin-service
  ports:
    - port: 3009
      targetPort: 3009
